name: 新工具建议
description: 提议一个可以完全在浏览器本地运行的教师微工具
title: "[工具建议] "
labels: ["type:tool"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么情境下遇到什么问题？请勿提交真实学生数据。
    validations: { required: true }
  - type: textarea
    id: io
    attributes: { label: 典型输入与输出 }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 最小范围与不包含内容 }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 核心功能可以在浏览器本地完成，且示例不含真实个人信息
          required: true
