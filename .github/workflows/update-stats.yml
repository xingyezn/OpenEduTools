name: Update statistics

on:
  schedule:
    # GitHub Actions cron 使用 UTC；18:00 UTC = 北京时间 02:00。
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch aggregated statistics
        env:
          STATS_API_URL: ${{ secrets.STATS_API_URL }}
          STATS_API_TOKEN: ${{ secrets.STATS_API_TOKEN }}
        run: |
          if [ -z "$STATS_API_URL" ] || [ -z "$STATS_API_TOKEN" ]; then
            echo "缺少 STATS_API_URL 或 STATS_API_TOKEN，跳过本次更新。"
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $STATS_API_TOKEN" \
            "$STATS_API_URL/admin/export" \
            -o data/stats.json.tmp
          jq . data/stats.json.tmp > data/stats.json
          rm -f data/stats.json.tmp

      - name: Commit changes when statistics changed
        id: commit
        run: |
          if git diff --quiet -- data/stats.json; then
            echo "统计无变化，不提交。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "chore(stats): update daily statistics"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送的提交不会触发其它工作流，因此显式派发 Pages 部署。
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
