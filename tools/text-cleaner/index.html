<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="可组合、可预览的本地文本清洗工具。"><title>文本清洗 · OpenEduTools</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/tool.css"><link rel="stylesheet" href="./style.css"><script src="../../js/theme.js"></script><script src="../../js/storage.js" defer></script><script src="../../js/favorites.js" defer></script><script src="../../js/recent.js" defer></script><script src="../../js/analytics.js" defer></script><script src="../../js/format.js" defer></script><script src="../../js/tool-page.js" defer></script><script src="./script.js" defer></script></head><body data-tool-id="text-cleaner"><a class="skip-link" href="#main">跳到主要内容</a><header class="site-header"><div class="container site-header__inner"><a class="brand" href="../../index.html">OpenEduTools</a><nav class="site-nav" aria-label="工具导航"><a href="../../all-tools.html">全部工具</a><label class="theme-field">主题<select class="select" data-theme-select aria-label="颜色主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></nav></div></header><main id="main" class="tool-layout"><nav class="breadcrumbs" aria-label="面包屑"><a href="../../all-tools.html">全部工具</a> / 文本清洗</nav><header class="tool-header"><div class="tool-header__row"><div><span class="tool-kicker">CLEAN TEXT</span><h1>文本清洗</h1><p>按需组合清理操作；默认不启用任何可能改变内容的选项。</p></div><button class="favorite-button" data-tool-favorite type="button" aria-pressed="false">☆ 收藏</button></div><span class="privacy-mark">文本仅在本页内存中处理</span></header><div class="tool-sections"><section class="panel" aria-labelledby="input-title"><h2 id="input-title">原始文本</h2><div class="field"><label for="source">粘贴文本</label><textarea id="source" placeholder="在这里粘贴需要整理的文本…"></textarea></div><fieldset class="options"><legend>选择清理操作</legend><label class="check"><input type="checkbox" data-option="trimLines">去除每行首尾空格</label><label class="check"><input type="checkbox" data-option="collapseSpaces">合并连续空格</label><label class="check"><input type="checkbox" data-option="collapseBlankLines">合并多余空行</label><label class="check"><input type="checkbox" data-option="removeEmptyLines">删除空行</label><label class="check"><input type="checkbox" data-option="dedupeLines">行去重（保留首次）</label><label class="check"><input type="checkbox" data-option="chinesePunctuation">统一为中文标点（可能改变含义）</label></fieldset><p id="status" class="status-line" role="status" aria-live="polite"></p></section><section class="panel" aria-labelledby="result-title"><h2 id="result-title">处理结果</h2><div class="field"><label for="output">可编辑结果</label><textarea id="output"></textarea></div><p id="summary" class="notice" aria-live="polite">输入 0 字符 / 0 行；输出 0 字符 / 0 行；无变化。</p><div class="tool-actions"><button id="copy" class="button" type="button">复制结果</button><button id="download" class="button button--secondary" type="button">下载 .txt</button><button id="undo" class="button button--secondary" type="button">撤销到原文</button><button id="clear" class="button button--danger" type="button">清空</button></div></section></div><noscript><p class="notice notice--error">此工具需要启用 JavaScript 才能运行。</p></noscript></main><div class="toast" data-toast role="status" hidden></div></body></html>
