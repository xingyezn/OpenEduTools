<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="在浏览器本地计算成绩统计与分布。"><title>成绩统计 · OpenEduTools</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/tool.css"><link rel="stylesheet" href="./style.css"><script src="../../js/theme.js"></script><script src="../../js/storage.js" defer></script><script src="../../js/favorites.js" defer></script><script src="../../js/recent.js" defer></script><script src="../../js/analytics.js" defer></script><script src="../../js/format.js" defer></script><script src="../../js/tool-page.js" defer></script><script src="./script.js" defer></script></head><body data-tool-id="score-statistics"><a class="skip-link" href="#main">跳到主要内容</a><header class="site-header"><div class="container site-header__inner"><a class="brand" href="../../index.html">OpenEduTools</a><nav class="site-nav" aria-label="工具导航"><a href="../../all-tools.html">全部工具</a><label class="theme-field">主题<select class="select" data-theme-select aria-label="颜色主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></nav></div></header><main id="main" class="tool-layout"><nav class="breadcrumbs" aria-label="面包屑"><a href="../../all-tools.html">全部工具</a> / 成绩统计</nav><header class="tool-header"><div class="tool-header__row"><div><span class="tool-kicker">SCORE LAB</span><h1>成绩统计</h1><p>输入一列分数，计算人数、平均数、中位数、极值、及格率和分数段。</p></div><button class="favorite-button" data-tool-favorite type="button" aria-pressed="false">☆ 收藏</button></div><span class="privacy-mark">成绩仅在本页内存中处理</span></header><div class="tool-sections"><section class="panel" aria-labelledby="input-title"><h2 id="input-title">输入分数</h2><div class="field"><label for="scores">每行一个分数，或粘贴单列 CSV</label><textarea id="scores" placeholder="88&#10;76.5&#10;92&#10;60" aria-describedby="format-help"></textarea><span id="format-help" class="small muted">可含标题“分数”；不读取姓名列。CSV 引号内的逗号和换行会按标准规则解析。</span></div><div class="field"><label for="file">上传单列 CSV（最大 1 MB）</label><input id="file" type="file" accept=".csv,text/csv,text/plain"></div><div class="form-grid"><div class="field"><label for="minimum">最低允许分数</label><input id="minimum" type="number" value="0" step="any"></div><div class="field"><label for="maximum">最高允许分数</label><input id="maximum" type="number" value="100" step="any"></div><div class="field"><label for="pass-line">及格线</label><input id="pass-line" type="number" value="60" step="any"></div></div><div class="field"><label for="bands">分数段（每行“名称:下限-上限”）</label><textarea id="bands" class="bands-input">优秀:90-100&#10;良好:80-90&#10;及格:60-80&#10;待提高:0-60</textarea><span class="small muted">下限包含，上限不包含；最高允许分数所在段包含上限。</span></div><div class="tool-actions"><button id="calculate" class="button" type="button">计算统计</button><button id="export" class="button button--secondary" type="button" disabled>导出汇总 CSV</button><button id="clear" class="button button--danger" type="button">清空</button></div><p id="status" class="status-line" role="status" aria-live="polite"></p></section><section class="panel" aria-labelledby="result-title"><h2 id="result-title">统计结果</h2><div id="result" class="result-box"><p class="muted">统计结果会显示在这里。数值四舍五入保留两位小数。</p></div></section><aside class="notice">导出只包含汇总统计和分数段，不包含原始成绩。输入不会被默认保存。</aside></div><noscript><p class="notice notice--error">此工具需要启用 JavaScript 才能运行。</p></noscript></main><div class="toast" data-toast role="status" hidden></div></body></html>
