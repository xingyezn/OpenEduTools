<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="将名单随机均衡分组。"><title>随机分组 · OpenEduTools</title>
  <link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/main.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/tool.css"><link rel="stylesheet" href="./style.css">
  <script src="../../js/theme.js"></script><script src="../../js/storage.js" defer></script><script src="../../js/favorites.js" defer></script><script src="../../js/recent.js" defer></script><script src="../../js/tool-page.js" defer></script><script src="./script.js" defer></script>
</head>
<body data-tool-id="random-group">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header"><div class="container site-header__inner"><a class="brand" href="../../index.html"><span class="brand__mark" aria-hidden="true">O</span>OpenEduTools</a><nav class="site-nav" aria-label="工具导航"><a href="../../index.html">全部工具</a><label class="theme-field">主题<select class="select" data-theme-select aria-label="颜色主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></nav></div></header>
  <main id="main" class="tool-layout">
    <nav class="breadcrumbs" aria-label="面包屑"><a href="../../index.html">全部工具</a> / 随机分组</nav>
    <header class="tool-header"><div class="tool-header__row"><div><span class="tool-kicker">TEAM MAKER</span><h1>随机分组</h1><p>使用无偏洗牌，将名单尽量均衡地分成若干组。</p></div><button class="favorite-button" data-tool-favorite type="button" aria-pressed="false">☆ 收藏</button></div><span class="privacy-mark">名单仅在本页内存中处理</span></header>
    <div class="tool-sections">
      <nav class="tool-tabs" aria-label="随机工具"><a class="tool-tab" href="../random-picker/index.html">随 机 点 名</a><a class="tool-tab is-active" href="./index.html" aria-current="page">随 机 分 组</a></nav>
      <section class="panel" aria-labelledby="group-title">
        <div class="tool-topbar"><span class="tool-brand"><span class="tool-brand__dot" aria-hidden="true"></span>课堂随机分组</span><button class="icon-btn" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" title="设置名单" aria-label="设置名单"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button></div>
        <h2 id="group-title" class="visually-hidden">分组设置</h2>
        <div class="group-controls">
          <div class="seg" role="group" aria-label="分组方式"><button class="seg__btn is-active" id="btnByCount" type="button" aria-pressed="true">按组数</button><button class="seg__btn" id="btnBySize" type="button" aria-pressed="false">按每组人数</button></div>
          <div class="num-wrap"><span id="numLabel">组数</span><input class="num-input" id="amount" type="number" min="1" max="99" value="4" inputmode="numeric" aria-label="组数"></div>
          <button class="button btn-group" id="group" type="button">分 组</button>
        </div>
        <p class="group-info" id="groupInfo"></p>
        <div class="group-results" id="result" aria-live="polite"><p class="empty-tip">点击「分组」开始随机分组</p></div>
        <div class="group-actions"><button class="button button--ghost" id="copy" type="button" disabled>复制分组结果</button></div>
      </section>
      <section id="settings-panel" class="panel settings-panel" aria-labelledby="settings-title" hidden>
        <h2 id="settings-title">名单与选项</h2>
        <div class="field"><label for="names">学生名单（每行一个，也可用逗号或空格分隔）</label><textarea id="names" spellcheck="false" placeholder="示例甲&#10;示例乙&#10;示例丙"></textarea><span id="name-count" class="small muted">有效人数：0</span></div>
        <div class="settings-options"><label class="check"><input id="dedupe" type="checkbox" checked>去除重复姓名</label></div>
        <div class="tool-actions"><button id="apply-names" class="button button--secondary" type="button">应用名单</button><button id="clear" class="button button--danger" type="button">清空</button></div>
      </section>
      <p id="status" class="status-line" role="status" aria-live="polite"></p>
      <aside class="notice">不能整除时，前面的组会依次多一人；按每组人数分组时，会先计算所需组数，再均衡分配。名单只在当前页面内存中处理。</aside>
    </div>
    <noscript><p class="notice notice--error">此工具需要启用 JavaScript 才能运行。</p></noscript>
  </main><div class="toast" data-toast role="status" hidden></div>
</body>
</html>
